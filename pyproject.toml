[project]
name = "hashindex"
version = "0.1.0"
description = "A document indexing and querying system using hash-based indexing"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "markitdown[pdf]>=0.1.4",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
hashindex = "hashindex.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hashindex"]
